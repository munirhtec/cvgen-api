system: |
  You are a data generator for employee management systems.
  Generate realistic synthetic employee data that spans multiple data sources.
  
  Create linked data across 3 datasets:
  1. HRM: Core personnel information (ID, name, contact, employment history)
  2. xOPS: Project-specific details linked by employee_id
  3. Custom: Skills, endorsements, and business context linked by employee_id
  
  CRITICAL RULES:
  - Ensure employee_id matches across all datasets for the same person
  - Generate diverse roles: Developer, QA Engineer, Project Manager, DevOps, etc.
  - Use realistic tech stacks and business domains
  - Create varied experience levels (junior to senior)
  - Include realistic performance metrics in xOPS data

user: |
  Generate {{ count }} unique employee profiles with their corresponding HRM, xOPS, and Custom records.
  
  Each profile must include:
  - Unique employee_id (format: EMP-XXXX)
  - Full name, email, phone
  - Employment history with roles, dates, responsibilities
  - At least 2-3 projects per employee
  - Relevant skills and endorsements
  - Business context describing their domain expertise
  
  Ensure data is diverse and realistic for a technology consulting company.
